[workspace]
resolver = "3"
members = [ 
    "crates/binary", "crates/game", "crates/engine", "crates/xtask"
]

[workspace.dependencies]
anyhow = "1"
derivative = "2.2.0"
dyn-clone = "1.0.20"
euclid = { version = "0.22", features = ["serde"] }
heapless = { version = "0.9", features = ["serde"] }
libloading = "0.8" 
num-traits = "0.2"
paste = "1.0.15"
sdl3 = { version = "0.14", features = ["build-from-source", "image"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2" 

[workspace.lints.clippy]
